<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Gem Circuit — Agentic Games</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./game.js" defer></script>
  </head>
  <body>
    <main class="game">
      <div class="top">
        <span>AGENTIC GAMES / MATCH 3</span
        ><button id="language" type="button">DE</button>
      </div>
      <h1>Gem Circuit</h1>
      <p class="intro" id="intro"></p>
      <div class="hud">
        <div><span id="scoreLabel"></span><strong id="score">0</strong></div>
        <div><span id="movesLabel"></span><strong id="moves">24</strong></div>
        <div><span id="targetLabel"></span><strong>1,200</strong></div>
      </div>
      <div class="board-wrap">
        <canvas
          id="canvas"
          width="500"
          height="500"
          tabindex="0"
          role="application"
          aria-label="Match 3 game board"
        ></canvas>
        <div id="overlay" class="overlay">
          <h2 id="overlayTitle"></h2>
          <p id="overlayText"></p>
          <button id="overlayButton" class="primary" type="button"></button>
        </div>
      </div>
      <div class="controls">
        <button id="restart" type="button"></button
        ><button id="pause" type="button"></button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="hint" id="touchHint"></p>
      <p class="hint" id="keyHint"></p>
      <p class="footer">HTML · CANVAS 2D · JAVASCRIPT · OFFLINE</p>
    </main>
  </body>
</html>

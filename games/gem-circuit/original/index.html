<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gem Circuit — Match 3</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark;background:#101220;color:#edf0ff;font-family:system-ui,sans-serif}body{margin:0;min-width:280px}button{font:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:3px solid #b5f361;outline-offset:4px}.game{max-width:530px;margin:auto;padding:22px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font:11px monospace;letter-spacing:.06em;color:#a4abc5}.top button{border:1px solid #414762;background:#20243a;color:#edf0ff;border-radius:6px;padding:10px}h1{font-size:34px;letter-spacing:-1.5px;margin:20px 0 4px;font-weight:600}.intro{font-size:13px;line-height:1.7;color:#bac2da;margin:0}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:20px 0 15px}.hud div{background:#1b1f34;border:1px solid #303650;border-radius:8px;padding:12px}.hud span{font:9px monospace;color:#aeb8d1;letter-spacing:.1em;display:block}.hud strong{font-size:24px;display:block;margin-top:5px;font-variant-numeric:tabular-nums;font-weight:500}.board-wrap{position:relative}canvas{display:block;width:100%;aspect-ratio:1;background:#191e32;border:1px solid #3b4261;border-radius:12px;touch-action:none}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:15px;padding:30px;background:#111729eF;border-radius:12px;text-align:center}.overlay.visible{display:flex}.overlay h2{font-size:28px;margin:0}.overlay p{font-size:14px;line-height:1.7;max-width:300px;margin:0;color:#c3cce3}.primary{border:0;border-radius:6px;padding:13px 23px;background:#b5f361;color:#12200a;font-weight:650;min-height:46px}.controls{display:flex;justify-content:space-between;gap:15px;margin-top:16px}.controls button{border:1px solid #485271;border-radius:6px;background:#232b45;color:#e5ecff;min-height:44px;padding:10px 16px}.status{min-height:40px;font-size:13px;line-height:1.65;color:#cee79c;margin:16px 0 4px}.hint{font-size:11px;line-height:1.8;color:#a9b4cf;margin:5px 0}.footer{font:10px monospace;color:#a9b4cf;margin-top:20px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main class="game"><div class="top"><span>AGENTIC GAMES / MATCH 3</span><button id="language" type="button">DE</button></div><h1>Gem Circuit</h1><p class="intro" id="intro"></p><div class="hud"><div><span id="scoreLabel"></span><strong id="score">0</strong></div><div><span id="movesLabel"></span><strong id="moves">24</strong></div><div><span id="targetLabel"></span><strong>1,200</strong></div></div><div class="board-wrap"><canvas id="canvas" width="500" height="500" tabindex="0" role="application" aria-label="Match 3 game board"></canvas><div id="overlay" class="overlay"><h2 id="overlayTitle"></h2><p id="overlayText"></p><button id="overlayButton" class="primary" type="button"></button></div></div><div class="controls"><button id="restart" type="button"></button><button id="pause" type="button"></button></div><p class="status" id="status" role="status" aria-live="polite"></p><p class="hint" id="touchHint"></p><p class="hint" id="keyHint"></p><p class="footer">HTML · CANVAS 2D · JAVASCRIPT · OFFLINE</p></main>
<script>
'use strict';
const SIZE=8,TYPES=6,TARGET=1200,MAX_MOVES=24;
function matches(board){const found=new Set();for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){const i=y*SIZE+x,v=board[i];if(v<0)continue;if(x<=SIZE-3&&board[i+1]===v&&board[i+2]===v){let k=x;while(k<SIZE&&board[y*SIZE+k]===v)found.add(y*SIZE+k++);}if(y<=SIZE-3&&board[i+SIZE]===v&&board[i+SIZE*2]===v){let k=y;while(k<SIZE&&board[k*SIZE+x]===v)found.add(k++*SIZE+x);}}return [...found];}
function adjacent(a,b){return a>=0&&b>=0&&Math.abs(a%SIZE-b%SIZE)+Math.abs(Math.floor(a/SIZE)-Math.floor(b/SIZE))===1;}
function swap(board,a,b){[board[a],board[b]]=[board[b],board[a]];}
function possibleMove(board){for(let i=0;i<board.length;i++)for(const j of [i+1,i+SIZE]){if(j>=board.length||!adjacent(i,j))continue;swap(board,i,j);const valid=matches(board).length>0;swap(board,i,j);if(valid)return [i,j];}return null;}
function freshBoard(){let b;do{b=[];for(let i=0;i<SIZE*SIZE;i++){let v;do{v=Math.floor(Math.random()*TYPES);}while((i%SIZE>=2&&b[i-1]===v&&b[i-2]===v)||(i>=SIZE*2&&b[i-SIZE]===v&&b[i-SIZE*2]===v));b.push(v);}}while(!possibleMove(b));return b;}
function refill(board){for(let x=0;x<SIZE;x++){const column=[];for(let y=SIZE-1;y>=0;y--)if(board[y*SIZE+x]>=0)column.push(board[y*SIZE+x]);for(let y=SIZE-1;y>=0;y--)board[y*SIZE+x]=column[SIZE-1-y]??Math.floor(Math.random()*TYPES);}}
// UI
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const words={en:{intro:'Swap adjacent gems. Match three or more. Reach 1,200 points in 24 moves.',scoreLabel:'SCORE',movesLabel:'MOVES',targetLabel:'TARGET',restart:'New game',pause:'Pause',resume:'Resume',touchHint:'Tap two neighboring gems, or swipe a gem toward its neighbor.',keyHint:'Keyboard: arrow keys move the cursor; Enter selects; Escape cancels.',ready:'Choose a gem to begin.',invalid:'That swap makes no match. No move used.',chain:n=>n>1?'Cascade ×'+n+'!':'Match!',shuffle:'No moves available. Board reshuffled.',paused:'Paused',pausedText:'The game pauses when you leave the window.',win:'Target reached!',winText:s=>'You scored '+s+' points. Play again?',lose:'Out of moves',loseText:s=>'You scored '+s+' of 1,200 points. Try a fresh board.',play:'Play again'},de:{intro:'Tausche benachbarte Edelsteine. Kombiniere mindestens drei. Erreiche 1.200 Punkte in 24 Zügen.',scoreLabel:'PUNKTE',movesLabel:'ZÜGE',targetLabel:'ZIEL',restart:'Neues Spiel',pause:'Pause',resume:'Weiter',touchHint:'Tippe auf zwei benachbarte Steine oder wische einen Stein zum Nachbarn.',keyHint:'Tastatur: Pfeiltasten bewegen den Cursor, Enter wählt aus, Escape bricht ab.',ready:'Wähle einen Stein.',invalid:'Kein Treffer. Der Zug zählt nicht.',chain:n=>n>1?'Kaskade ×'+n+'!':'Treffer!',shuffle:'Keine Züge mehr. Spielfeld neu gemischt.',paused:'Pause',pausedText:'Beim Verlassen des Fensters pausiert das Spiel.',win:'Ziel erreicht!',winText:s=>'Du hast '+s+' Punkte. Noch eine Runde?',lose:'Keine Züge mehr',loseText:s=>s+' von 1.200 Punkten erreicht. Versuche ein neues Spielfeld.',play:'Noch einmal'}};
let lang=navigator.language.startsWith('de')?'de':'en',t=words[lang];
let board=freshBoard(),score=0,moves=MAX_MOVES,selected=-1,cursor=0,pointerStart=null,paused=false,result='',phase='idle',pending=[],delay=0,chain=1,particles=[],last=0,pulse=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function labels(){t=words[lang];document.documentElement.lang=lang;for(const id of ['intro','scoreLabel','movesLabel','targetLabel','restart','touchHint','keyHint'])$(id).textContent=t[id];$('language').textContent=lang==='en'?'DE':'EN';$('pause').textContent=paused?t.resume:t.pause;canvas.setAttribute('aria-label',lang==='de'?'Match-3-Spielfeld. Pfeiltasten und Enter zum Spielen.':'Match-3 board. Arrow keys and Enter to play.');message(t.ready);showOverlay();}
function message(text){$('status').textContent=text;}
function hud(){$('score').textContent=score.toLocaleString(lang);$('moves').textContent=moves;}
function showOverlay(){const visible=paused||!!result;$('overlay').classList.toggle('visible',visible);if(!visible)return;$('overlayTitle').textContent=paused?t.paused:result==='win'?t.win:t.lose;$('overlayText').textContent=paused?t.pausedText:result==='win'?t.winText(score):t.loseText(score);$('overlayButton').textContent=paused?t.resume:t.play;}
function togglePause(value=!paused){if(result)return;paused=value;pointerStart=null;selected=-1;$('pause').textContent=paused?t.resume:t.pause;showOverlay();}
function restart(){board=freshBoard();score=0;moves=MAX_MOVES;selected=-1;cursor=0;paused=false;result='';phase='idle';pending=[];particles=[];delay=0;chain=1;hud();labels();}
function attempt(a,b){if(paused||result||phase!=='idle'||!adjacent(a,b))return;swap(board,a,b);const hit=matches(board);selected=-1;if(!hit.length){swap(board,a,b);message(t.invalid);return;}moves--;chain=1;pending=hit;phase='clear';delay=reduced?.01:.22;hud();}
function choose(i){if(paused||result||phase!=='idle')return;cursor=i;if(selected===i){selected=-1;return;}if(selected>=0&&adjacent(selected,i))attempt(selected,i);else selected=i;}
function finishTurn(){if(score>=TARGET){result='win';showOverlay();}else if(moves<=0){result='lose';showOverlay();}else if(!possibleMove(board)){board=freshBoard();message(t.shuffle);}}
function resolve(dt){if(phase==='idle')return;delay-=dt;if(delay>0)return;if(phase==='clear'){for(const i of pending){if(!reduced)for(let n=0;n<5;n++)particles.push({x:i%SIZE+.5,y:Math.floor(i/SIZE)+.5,vx:(Math.random()-.5)*3,vy:-Math.random()*3,life:.5,type:board[i]});board[i]=-1;}score+=pending.length*30*chain;message(t.chain(chain));hud();refill(board);phase='settle';delay=reduced?.01:.18;}else{pending=matches(board);if(pending.length){chain++;phase='clear';delay=reduced?.01:.2;}else{phase='idle';finishTurn();}}}
const colors=['#75e8ff','#f79acc','#c3f477','#b9a2ff','#ffbf75','#79e2b2'];
function gem(x,y,r,type,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);const sides=[4,6,3,5,8,4][type],rot=type===0?Math.PI/4:type===5?0:-Math.PI/2;const g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#ffffff');g.addColorStop(.25,colors[type]);g.addColorStop(1,colors[type]+'9a');ctx.fillStyle=g;ctx.strokeStyle=colors[type];ctx.lineWidth=1.2;ctx.beginPath();for(let i=0;i<sides;i++){const a=rot+i*Math.PI*2/sides;const px=Math.cos(a)*r,py=Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fill();ctx.stroke();ctx.globalAlpha=alpha*.35;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(-r*.38,-r*.2);ctx.lineTo(0,-r*.55);ctx.lineTo(r*.3,-r*.1);ctx.stroke();ctx.restore();}
function resize(){const s=canvas.getBoundingClientRect().width,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(s*dpr);canvas.height=Math.round(s*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
function draw(dt){const w=canvas.getBoundingClientRect().width,cell=(w-20)/SIZE;ctx.clearRect(0,0,w,w);pulse+=dt;for(let i=0;i<board.length;i++){const x=10+(i%SIZE)*cell,y=10+Math.floor(i/SIZE)*cell;ctx.fillStyle=(i+Math.floor(i/SIZE))%2?'#1c233b':'#202941';ctx.fillRect(x+1,y+1,cell-2,cell-2);const chosen=i===selected;const hit=phase==='clear'&&pending.includes(i);if(chosen||hit){ctx.fillStyle=hit?'#ffffff19':'#b5f36125';ctx.fillRect(x+1,y+1,cell-2,cell-2);ctx.strokeStyle=hit?'#ffffff': '#b5f361';ctx.lineWidth=2;ctx.strokeRect(x+3,y+3,cell-6,cell-6);}if(board[i]>=0){const scale=hit&&!reduced?.85+.1*Math.sin(pulse*20):1;gem(x+cell/2,y+cell/2,cell*.33*scale,board[i]);}if(i===cursor&&document.activeElement===canvas){ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.strokeRect(x+5,y+5,cell-10,cell-10);ctx.setLineDash([]);}}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=6*dt;p.life-=dt;gem(10+p.x*cell,10+p.y*cell,cell*.07,p.type,Math.max(0,p.life*2));}particles=particles.filter(p=>p.life>0);}
function frame(time){const dt=Math.min((time-last)/1000||0,.05);last=time;if(!paused&&!result){resolve(dt);draw(dt);}else draw(0);requestAnimationFrame(frame);}
function cellAt(event){const r=canvas.getBoundingClientRect(),cell=(r.width-20)/SIZE,x=Math.floor((event.clientX-r.left-10)/cell),y=Math.floor((event.clientY-r.top-10)/cell);return x>=0&&x<SIZE&&y>=0&&y<SIZE?y*SIZE+x:-1;}
canvas.addEventListener('pointerdown',event=>{const i=cellAt(event);if(i<0)return;event.preventDefault();canvas.focus({preventScroll:true});pointerStart={i,x:event.clientX,y:event.clientY};canvas.setPointerCapture(event.pointerId);});
canvas.addEventListener('pointerup',event=>{if(!pointerStart)return;const from=pointerStart;pointerStart=null;const dx=event.clientX-from.x,dy=event.clientY-from.y;if(Math.hypot(dx,dy)>15){const j=from.i+(Math.abs(dx)>Math.abs(dy)?(dx>0?1:-1):(dy>0?SIZE:-SIZE));if(j>=0&&j<64&&adjacent(from.i,j))attempt(from.i,j);}else{const i=cellAt(event);if(i>=0)choose(i);}});
canvas.addEventListener('pointercancel',()=>{pointerStart=null;});
canvas.addEventListener('keydown',event=>{if(paused||result)return;const map={ArrowLeft:-1,ArrowRight:1,ArrowUp:-SIZE,ArrowDown:SIZE};if(event.key in map){event.preventDefault();const n=cursor+map[event.key];if(n>=0&&n<64&&adjacent(cursor,n))cursor=n;}else if(event.key==='Enter'||event.key===' '){event.preventDefault();if(!event.repeat)choose(cursor);}else if(event.key==='Escape')selected=-1;});
$('restart').onclick=restart;$('pause').onclick=()=>togglePause();$('overlayButton').onclick=()=>{paused?togglePause(false):restart();canvas.focus({preventScroll:true});};$('language').onclick=()=>{lang=lang==='en'?'de':'en';labels();hud();};
window.addEventListener('blur',()=>togglePause(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)togglePause(true);});window.addEventListener('resize',resize);
resize();labels();hud();requestAnimationFrame(frame);
</script></body></html>
